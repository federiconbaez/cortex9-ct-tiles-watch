[package]
name = "ct_tiles_watch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bounded static-ct-api tile reader: checkpoint consistency, catch-up and SAN detection measured against crt.sh"
publish = false

[dependencies]
base64 = "0.22"
flate2 = "1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ureq = { version = "2.12", features = ["gzip"] }
x509-parser = "0.18.1"
